[workspace]
resolver = "2"
members = [
    "crates/rekeydb-core",
    "crates/rekeydb-protocol",
    "crates/rekeydb-server",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.99"

[workspace.dependencies]
rekeydb-core = { path = "crates/rekeydb-core" }
rekeydb-protocol = { path = "crates/rekeydb-protocol" }

mio = { version = "1.2", features = ["net", "os-poll"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
